<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#996437">
<meta name="description" content="Simulador comercial Tera Mix — Tera Nutrição Vegetal">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tera Mix">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:#F7F4F0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Simulador Tera Mix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap">
<style>
/* ────────────────────────────────────────────────────────────────
   Tera Nutrição Vegetal — identidade do simulador de campo.
   Cores da marca amostradas do logotipo: laranja #F37021,
   marrom #996437, preto #231F20, branco.
   Marrom = estrutura e superfícies de marca. Laranja = ganho e ênfase.
   Vermelho só para custo a mais. Coluna única, alvos grandes,
   numerais tabulares, contraste alto para leitura sob sol.
   ──────────────────────────────────────────────────────────────── */
:root{
  --paper:#F7F4F0; --card:#FFFFFF; --sunk:#F0E9E1;
  --ink:#231F20; --ink2:#6B615B; --line:#E3D9CF;
  --brown:#996437; --brown-deep:#6F4726; --brown-soft:#F2E7DB;
  --orange:#F37021; --orange-text:#B04D0C; --orange-soft:#FDEBDE;
  --red:#A3301A; --red-soft:#FAE6E1;
  --on-brand:#FFFFFF; --mark-other:#BCAC9D;
  --capa-bg:#996437; --capa-fg:#FFFFFF; --capa-eyebrow:#FFD9BC;
  --fd:"Montserrat",system-ui,sans-serif;
  --fb:"Open Sans",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#17120F; --card:#201A16; --sunk:#1B1511;
  --ink:#F3EBE4; --ink2:#A89A8F; --line:#362C25;
  --brown:#C99055; --brown-deep:#E0AE74; --brown-soft:#2A1E14;
  --orange:#FF8B45; --orange-text:#FFA06A; --orange-soft:#2E1C11;
  --red:#E8775C; --red-soft:#2E1711;
  --on-brand:#1A1309; --mark-other:#6B5C51;
  --capa-bg:#3A2817; --capa-fg:#F7EFE7; --capa-eyebrow:#FFA06A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#17120F; --card:#201A16; --sunk:#1B1511;
  --ink:#F3EBE4; --ink2:#A89A8F; --line:#362C25;
  --brown:#C99055; --brown-deep:#E0AE74; --brown-soft:#2A1E14;
  --orange:#FF8B45; --orange-text:#FFA06A; --orange-soft:#2E1C11;
  --red:#E8775C; --red-soft:#2E1711;
  --on-brand:#1A1309; --mark-other:#6B5C51;
  --capa-bg:#3A2817; --capa-fg:#F7EFE7; --capa-eyebrow:#FFA06A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;
  line-height:1.55;margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.num{font-variant-numeric:tabular-nums}

/* ── assinatura ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);margin-inline:-16px;padding:11px 16px;
  display:flex;align-items:center;gap:10px}
.mark{display:flex;align-items:center;min-width:0}
.mark img{height:34px;width:auto;display:block}
.mark img.logo-dark{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mark img.logo-light{display:none}
  :root:not([data-theme="light"]) .mark img.logo-dark{display:block}}
:root[data-theme="dark"] .mark img.logo-light{display:none}
:root[data-theme="dark"] .mark img.logo-dark{display:block}
.top .sp{margin-left:auto}
.ghost{appearance:none;background:none;border:1px solid var(--line);color:var(--ink2);
  font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
.ghost:hover{border-color:var(--brown);color:var(--brown-deep)}

/* ── tipografia ── */
h1{font-family:var(--fd);font-weight:700;font-size:25px;line-height:1.18;letter-spacing:-.015em;
  margin:26px 0 6px;text-wrap:balance}
.sub{color:var(--ink2);margin:0 0 22px;font-size:15px}
h2{font-family:var(--fd);font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brown-deep);margin:30px 0 10px}

/* ── capa ── */
.capa{background:var(--capa-bg);border-radius:var(--r);padding:24px 20px 26px;margin:18px 0 22px}
.capa .slogan{font-family:var(--fd);font-weight:600;font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--capa-eyebrow);margin:0 0 10px}
.capa h1{color:var(--capa-fg);margin:0;font-size:27px}
.capa .sub{color:var(--capa-fg);opacity:.9;margin:0;font-size:15px}

/* ── escolha de rota ── */
.routes{display:grid;gap:12px}
.route{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:17px;cursor:pointer;font:inherit;color:inherit;
  transition:border-color .15s,transform .1s}
.route:hover{border-color:var(--orange)}
.route:active{transform:scale(.995)}
.route b{display:block;font-family:var(--fd);font-weight:600;font-size:18px;line-height:1.25;margin-bottom:4px}
.route em{display:block;font-style:normal;color:var(--ink2);font-size:14px;line-height:1.5}
.route .tag{display:inline-block;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--orange-text);background:var(--orange-soft);
  padding:4px 10px;border-radius:999px;margin-bottom:10px}

/* ── passos ── */
.dots{display:flex;gap:6px;align-items:center;margin:22px 0 4px}
.dot{height:4px;flex:1;border-radius:2px;background:var(--line)}
.dot.on{background:var(--orange)}
.stepno{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink2);margin:14px 0 0}

.field{margin-bottom:18px}
label{display:block;font-size:14px;color:var(--ink2);margin-bottom:6px}
input,select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange)}
.unit{position:relative}
.unit input{padding-right:66px}
.unit .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink2);
  font-size:14px;pointer-events:none}
.hint{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:380px){.two{grid-template-columns:1fr}}

.nav{display:flex;gap:10px;margin-top:26px}
.btn{flex:1;appearance:none;border:none;border-radius:11px;font-family:var(--fd);font-weight:600;
  font-size:16px;padding:15px;cursor:pointer;background:var(--brown);color:var(--on-brand)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{flex:0 0 auto;background:var(--sunk);color:var(--ink);border:1px solid var(--line);padding-inline:20px}

/* ── resultado ── */
.who{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink2);margin:24px 0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:var(--orange-soft);border-color:transparent}
.hero .big{font-family:var(--fd);font-weight:700;font-size:36px;line-height:1.05;color:var(--orange-text);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .cap{color:var(--ink2);font-size:14px;margin-top:6px}

.rows{display:grid;gap:0}
.row{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .k{flex:1;min-width:0;font-size:14px;color:var(--ink2);line-height:1.4}
.row .v{font-family:var(--fd);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v.g{color:var(--orange-text)}
.row.tot{border-top:2px solid var(--line);margin-top:4px;padding-top:12px}
.row.tot .k{color:var(--ink);font-weight:600}
.row.tot .v{font-size:20px}

.badge{display:inline-block;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--orange-soft);color:var(--orange-text)}
.b-warn{background:var(--brown-soft);color:var(--brown-deep)}
.b-bad{background:var(--red-soft);color:var(--red)}

/* ── barras ── */
.bars{display:grid;gap:12px;margin-top:4px}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;
  color:var(--ink2);margin-bottom:5px}
.bar .lab b{font-family:var(--fd);font-weight:600;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.fill.mix{background:var(--orange)}
.fill.oth{background:var(--mark-other)}

.note{background:var(--sunk);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--ink2);margin-bottom:12px}
.note b{color:var(--ink);font-weight:600}
.alert{background:var(--brown-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;
  color:var(--brown-deep);margin-bottom:12px}
.alert b{font-weight:700}
.speech{background:var(--card);border:2px solid var(--orange);border-radius:var(--r);padding:17px;margin-bottom:12px}
.speech .t{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--orange-text);margin-bottom:8px}
.speech p{margin:0;font-size:16px;line-height:1.6}

details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
summary{cursor:pointer;font-size:14px;color:var(--ink2);font-weight:600}
summary::marker{color:var(--brown)}
details[open] summary{margin-bottom:12px}

.foot{color:var(--ink2);font-size:12.5px;line-height:1.6;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.foot p{margin:0 0 6px}

@media print{
  :root{--paper:#fff;--card:#fff;--sunk:#F2EDE7;--ink:#231F20;--ink2:#5A514B;--line:#CFC4B9;
    --brown:#996437;--brown-deep:#6F4726;--brown-soft:#F2E7DB;
    --orange:#F37021;--orange-text:#B04D0C;--orange-soft:#FDEBDE;--mark-other:#BCAC9D;
    --capa-bg:#996437;--capa-fg:#FFFFFF;--capa-eyebrow:#FFD9BC}
  .nav,.noprint,#restart{display:none!important}
  .top{position:static;border-bottom:2px solid var(--brown);margin:0 0 4px;padding:0 0 10px}
  .mark img.logo-dark{display:none!important} .mark img.logo-light{display:block!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .card,.note,.speech,details,.bar{break-inside:avoid}
  details{border:none;padding:0}
  details summary{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top noprint">
    <div class="mark" id="marca"></div>
    <div class="sp"></div>
    <button class="ghost" id="restart" hidden>Nova simulação</button>
  </div>

  <!-- HOME -->
  <section id="s-home">
    <div class="capa">
      <p class="slogan">Matéria orgânica transforma</p>
      <h1>Simulador Tera Mix</h1>
    </div>
    <div class="routes">
      <button class="route" data-go="base">
        <span class="tag">Cliente que já compra</span>
        <b>Tera Base × Tera Mix</b>
        <em>Quanto de nutriente a mais ele leva e quanto isso custa por hectare.</em>
      </button>
      <button class="route" data-go="min">
        <span class="tag">Cliente de fertilizante mineral</span>
        <b>Tera Mix × adubo químico</b>
        <em>Comparação por hectare e quanto de químico ainda precisa entrar junto.</em>
      </button>
    </div>
    <div class="foot">
      <p>Tera Nutrição Vegetal · versão <span id="ver"></span> · referência <span id="ref"></span></p>
    </div>
  </section>

  <!-- FORMULÁRIO -->
  <section id="s-form" hidden>
    <div class="dots" id="dots"></div>
    <p class="stepno" id="stepno"></p>
    <h2 class="q" id="qtitle" style="font-size:22px;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin:5px 0 18px;line-height:1.25"></h2>
    <div id="qbody"></div>
    <div class="nav">
      <button class="btn sec" id="back">Voltar</button>
      <button class="btn" id="next">Continuar</button>
    </div>
  </section>

  <!-- RESULTADO -->
  <section id="s-res" hidden>
    <div id="out"></div>
    <div class="nav noprint">
      <button class="btn sec" id="edit">Ajustar</button>
      <button class="btn" id="pdf">Gerar PDF</button>
    </div>
    <p class="hint noprint" id="pdfnote" hidden style="text-align:center">O PDF funciona no aplicativo instalado no celular.</p>
  </section>
</div>

/* ══════════════ CÁLCULO ══════════════ */
function calcBase(d){
  var fr = d.frete || 0;
  var pb = d.pprod + fr;                      /* Tera Base posto na fazenda */
  var pm = d.pprod*(1+CFG.reajuste) + fr;     /* Tera Mix posto: reajuste só no produto */
  var D = d.dose;
  var kgB = PB*10, kgM = PM*10;
  return {
    pb:pb, pm:pm, D:D, prod:d.pprod, frete:fr, prodMix:d.pprod*(1+CFG.reajuste),
    kgB:kgB, kgM:kgM, dkg:kgM-kgB,
    cB:pb/kgB, cM:pm/kgM, cAdd:(pm-pb)/(kgM-kgB),
    varC:(pm/kgM)/(pb/kgB)-1,
    haNutB:D*kgB, haNutM:D*kgM,
    haMoB:D*CFG.base.mo, haMoM:D*CFG.mix.mo,
    haCB:D*pb, haCM:D*pm
  };
}
function mineralEscolhido(d){
  if(d.midx==="x") return { nome:"Fertilizante do cliente", n:d.cn||0, p:d.cp||0, k:d.ck||0, preco:d.mpreco };
  var m = CFG.minerais[parseInt(d.midx,10)] || CFG.minerais[0];
  return { nome:m.nome, n:m.n, p:m.p, k:m.k, preco:d.mpreco };
}
function calcMin(d, doseMixForcada){
  var m = mineralEscolhido(d);
  var fr = d.frete || 0;
  var pb = d.pprod + fr;
  var pm = d.pprod*(1+CFG.reajuste) + fr;
  var Dm = d.mdose;                      // kg/ha
  var pN = Dm*m.n/100, pP = Dm*m.p/100, pK = Dm*m.k/100;
  var pT = pN+pP+pK;
  var custoMin = Dm/1000*m.preco;
  var doseIgual = pT/(PM*10);            // t/ha de Tera Mix que iguala o NPK
  var dose = (doseMixForcada!==undefined && doseMixForcada>0) ? doseMixForcada : doseIgual;

  var eN = dose*CFG.mix.n*10, eP = dose*CFG.mix.p*10, eK = dose*CFG.mix.k*10;
  var custoMix = dose*pm;

  var fN = Math.max(0,pN-eN), fP = Math.max(0,pP-eP), fK = Math.max(0,pK-eK);
  var F = CFG.fontes;
  var vMap = (d.pmap>0 ? d.pmap : F.map.preco);
  var vKcl = (d.pkcl>0 ? d.pkcl : F.kcl.preco);
  var vUre = (d.pureia>0 ? d.pureia : F.ureia.preco);
  var kgMap = F.map.p>0 ? fP/(F.map.p/100) : 0;
  var kgKcl = F.kcl.k>0 ? fK/(F.kcl.k/100) : 0;
  var nJa   = kgMap*F.map.n/100 + kgKcl*F.kcl.n/100;
  var kgUre = F.ureia.n>0 ? Math.max(0,fN-nJa)/(F.ureia.n/100) : 0;
  var cMap = kgMap/1000*vMap, cKcl = kgKcl/1000*vKcl, cUre = kgUre/1000*vUre;
  var compKg = kgMap+kgKcl+kgUre, compC = cMap+cKcl+cUre;

  return {
    m:m, pb:pb, pm:pm, Dm:Dm, prod:d.pprod, frete:fr, prodMix:d.pprod*(1+CFG.reajuste),
    pN:pN,pP:pP,pK:pK,pT:pT, custoMin:custoMin, moMin:0,
    doseIgual:doseIgual, dose:dose,
    eN:eN,eP:eP,eK:eK,eT:eN+eP+eK, custoMix:custoMix, moMix:dose*CFG.mix.mo,
    fN:fN,fP:fP,fK:fK,
    sN:Math.max(0,eN-pN), sP:Math.max(0,eP-pP), sK:Math.max(0,eK-pK),
    kgMap:kgMap,kgKcl:kgKcl,kgUre:kgUre,cMap:cMap,cKcl:cKcl,cUre:cUre,
    vMap:vMap,vKcl:vKcl,vUre:vUre,
    compKg:compKg, compC:compC,
    totalComb: dose*pm + compC,
    economia: custoMin - (dose*pm + compC),
    tonComb: dose + compKg/1000
  };
}

      '<div class="track"><div class="fill '+(i.mix?"mix":"oth")+'" style="width:'+(100*i.v/max).toFixed(1)+'%"></div></div></div>';
  }).join("")+'</div>';
}

function nutLinha(nome, prog, entrega){
  var dif = entrega-prog;
  var b = dif>=0 ? '<span class="badge b-ok">sobra '+f0.format(dif)+' kg</span>'
                 : '<span class="badge b-warn">falta '+f0.format(-dif)+' kg</span>';
  return '<div class="row"><span class="k">'+nome+' — programa '+f0.format(prog)+' kg/ha</span><span class="v">'+b+'</span></div>';
}
function rodape(){
  return '<div class="foot"><p>Comparação de custo entre produtos, não recomendação agronômica. '+
    'Nutriente orgânico não tem a mesma prontidão do mineral.</p>'+
    '<p>Compare sempre posto na fazenda contra posto na fazenda.</p>'+
    '<p>Tera Nutrição Vegetal · simulador v'+CFG.versao+' · referência '+CFG.referencia+'</p></div>';
}

function resultado(){
  $("out").innerHTML = (ST.rota==="base") ? renderBase() : renderMin();
  var dm = $("doseMix");
  if(dm) dm.addEventListener("change", function(){
    var v = parseFloat(String(dm.value).replace(",","."));
    ST.d.doseMix = (v>0 ? v : undefined); save(); resultado();
  });
  mostra("s-res");
}

/* ══════════════ EVENTOS ══════════════ */
$("qbody").addEventListener("input", valida);
$("qbody").addEventListener("change", function(e){
  if(e.target && e.target.id==="midx"){ var c=$("custom"); if(c) c.hidden = (e.target.value!=="x"); }
  valida();
});
Array.prototype.forEach.call(document.querySelectorAll(".route"), function(b){
  b.addEventListener("click", function(){
    ST.rota = b.getAttribute("data-go"); ST.passo = 0; ST.d.doseMix = undefined;
    mostra("s-form"); pinta();
  });
});
$("next").addEventListener("click", function(){
  colhe();
  var ps = PASSOS[ST.rota];
  if(!ps[ST.passo].ok(ST.d)) return;
  if(ST.passo < ps.length-1){ ST.passo++; pinta(); window.scrollTo(0,0); }
  else { ST.d.doseMix = undefined; resultado(); }
});
$("back").addEventListener("click", function(){
  colhe();
  if(ST.passo===0){ mostra("s-home"); } else { ST.passo--; pinta(); }
});
$("edit").addEventListener("click", function(){
  ST.passo = PASSOS[ST.rota].length-1; mostra("s-form"); pinta();
});
$("restart").addEventListener("click", function(){ ST.passo=0; ST.d.doseMix=undefined; mostra("s-home"); });
$("pdf").addEventListener("click", function(){
  Array.prototype.forEach.call(document.querySelectorAll("#out details"), function(x){ x.open = true; });
  try{ window.print(); }catch(e){}
});
if(EMB){ $("pdf").hidden = true; $("pdfnote").hidden = false; $("edit").style.flex = "1"; }

(function(){
  var m = $("marca");
  m.innerHTML = '<img class="logo-light" src="'+CFG.logo+'" alt="Tera Nutrição Vegetal">'+
                '<img class="logo-dark" src="'+CFG.logoEscuro+'" alt="">';
})();
$("ver").textContent = CFG.versao;
$("ref").textContent = CFG.referencia;
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.addEventListener("updatefound", function () {
        var novo = reg.installing;
        if (!novo) return;
        novo.addEventListener("statechange", function () {
          if (novo.state === "installed" && navigator.serviceWorker.controller) { location.reload(); }
        });
      });
    }).catch(function () {});
  });
}
</script>
